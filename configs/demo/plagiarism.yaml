# Démonstration hors ligne de l'étude B (détection de plagiat) sur un corpus synthétique
# construit à partir du corpus jouet (synonymes intégrés au lieu de WordNet).
# Préparer le corpus : plagia corpus toy --kind plagiarism --out data/corpora/toy_plagiarism
name: demo_plagiarism
task: plagiarism
description: >-
  Démonstration de l'étude B : niveaux d'obfuscation O0 à O3, passages de 50, 100 et
  300 mots, jeux de caractéristiques lexicales (L) et lexicales + entités (L+E), deux
  classificateurs, lignes de base cosinus TF-IDF et recouvrement de shingles.
seed: 42
n_jobs: 2
annotation:
  engine: heuristic
  cache_path: data/cache/annotations.sqlite
protocol:
  seeds: 2
  bootstrap: 300
plagiarism:
  corpus: data/corpora/toy_plagiarism
  levels: [O0, O1, O2, O3]
  sizes: [50, 100, 300]
  feature_sets:
    L: [cosine_tfidf, containment_shingles, lcs]
    L+E: [cosine_tfidf, containment_shingles, lcs, jaccard_entities, type_divergence]
  classifiers:
    logreg: {type: logreg}
    svm: {type: linear_svm}
  window_sentences: 3
  negatives_per_positive: 3
  test_prevalence: [1, 10]
  retrieval: {method: tfidf, k: 5}
  alignment:
    min_density: 3.0         # corpus jouet : vocabulaire réduit, correspondances fortuites fréquentes
