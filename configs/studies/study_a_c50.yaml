# Étude A — attribution d'auteur sur Reuters C50 (plan de base du § 7.1).
# 8 représentations × 3 classificateurs × 4 nombres d'auteurs × 3 tailles d'entraînement
# = 288 conditions, 1 440 exécutions avec 5 graines (+ lignes de base « classe majoritaire »).
# Prérequis : plagia corpus c50 --source data/raw/c50.zip --download --out data/corpora/c50
name: study_a_c50
task: attribution
description: >-
  Étude A sur C50 : sac de mots, TF-IDF de mots, n-grammes de caractères, mots-outils et
  stylométrie, n-grammes d'étiquettes, entités et types, et leurs combinaisons ; naïve
  Bayes maison, SVM linéaire, régression logistique.
seed: 42
n_jobs: 4
annotation:
  engine: spacy
  model: en_core_web_sm
  cache_path: data/cache/annotations.sqlite
protocol:
  cv_folds: 5
  seeds: 5
  bootstrap: 1000
  confidence: 0.95
  scoring: f1_macro
  group_by: none
attribution:
  corpus: data/corpora/c50
  representations:
    R1:
      description: sac de mots
      blocks: [{type: bow}]
    R2:
      description: TF-IDF de mots (1 à 2 grammes)
      blocks: [{type: tfidf, params: {ngram_range: [1, 2], min_df: 2}}]
    R3:
      description: TF-IDF de n-grammes de caractères (3 à 5)
      blocks: [{type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}]
    R4:
      description: mots-outils et stylométrie
      blocks: [{type: stylometry}]
    R5:
      description: n-grammes d'étiquettes grammaticales
      blocks: [{type: pos_ngrams, params: {ngram_range: [1, 3]}}]
    R6:
      description: entités et types d'entités
      blocks: [{type: entities}]
    Style:
      description: R3 + R4 + R5
      blocks:
        - {type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}
        - {type: stylometry, weight: 0.5}
        - {type: pos_ngrams, weight: 0.5}
    Style+entities:
      description: Style + R6
      blocks:
        - {type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}
        - {type: stylometry, weight: 0.5}
        - {type: pos_ngrams, weight: 0.5}
        - {type: entities, weight: 0.5}
  classifiers:
    nb:
      type: naive_bayes
      grid: {alpha: [0.01, 0.1, 1.0]}
    svm:
      type: linear_svm
      grid: {C: [0.1, 1.0, 10.0]}
    logreg:
      type: logreg
      grid: {C: [1.0, 10.0, 100.0]}
  n_authors: [5, 10, 20, 50]
  n_train: [10, 25, 50]
  top_k: 3
  explain_top_k: 20
  error_sample: 30
