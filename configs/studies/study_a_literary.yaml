# Étude A — corpus littéraire (10 auteurs, découpage par œuvre) : 8 × 3 = 24 conditions.
# Prérequis : plagia corpus gutenberg --config configs/corpus/gutenberg.yaml --out data/corpora/literary
name: study_a_literary
task: attribution
description: Étude A sur le corpus littéraire Gutenberg, évaluation inter-œuvres (plis groupés par œuvre).
seed: 42
n_jobs: 4
annotation:
  engine: spacy
  model: en_core_web_sm
  cache_path: data/cache/annotations.sqlite
protocol:
  cv_folds: 5
  seeds: 5
  bootstrap: 1000
  group_by: work
attribution:
  corpus: data/corpora/literary
  representations:
    R1: {blocks: [{type: bow}]}
    R2: {blocks: [{type: tfidf, params: {ngram_range: [1, 2], min_df: 2}}]}
    R3: {blocks: [{type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}]}
    R4: {blocks: [{type: stylometry}]}
    R5: {blocks: [{type: pos_ngrams}]}
    R6: {blocks: [{type: entities}]}
    Style:
      blocks:
        - {type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}
        - {type: stylometry, weight: 0.5}
        - {type: pos_ngrams, weight: 0.5}
    Style+entities:
      blocks:
        - {type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}
        - {type: stylometry, weight: 0.5}
        - {type: pos_ngrams, weight: 0.5}
        - {type: entities, weight: 0.5}
  classifiers:
    nb: {type: naive_bayes, grid: {alpha: [0.01, 0.1, 1.0]}}
    svm: {type: linear_svm, grid: {C: [0.1, 1.0, 10.0]}}
    logreg: {type: logreg, grid: {C: [1.0, 10.0, 100.0]}}
  n_authors: [null]
  n_train: [null]
