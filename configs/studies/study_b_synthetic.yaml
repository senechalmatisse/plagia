# Étude B — détection de plagiat sur le corpus synthétique (plan de base du § 7.2) :
# 4 niveaux × 3 tailles × 2 jeux de caractéristiques × 2 classificateurs = 48 conditions,
# 240 exécutions avec 5 graines (+ lignes de base cosinus TF-IDF et recouvrement de shingles).
# Prérequis :
#   plagia corpus synthetic --base data/corpora/c50 --config configs/corpus/synthetic.yaml --out data/corpora/synthetic
name: study_b_synthetic
task: plagiarism
description: >-
  Étude B : similarités lexicales (L) et lexicales + entités et types (L+E), régression
  logistique et SVM linéaire, prévalence équilibrée et réaliste (1:10).
seed: 42
n_jobs: 4
annotation:
  engine: spacy
  model: en_core_web_sm
  cache_path: data/cache/annotations.sqlite
protocol:
  seeds: 5
  bootstrap: 1000
plagiarism:
  corpus: data/corpora/synthetic
  levels: [O0, O1, O2, O3]
  sizes: [50, 100, 300]
  feature_sets:
    L: [cosine_tfidf, containment_shingles, lcs]
    L+E: [cosine_tfidf, containment_shingles, lcs, jaccard_entities, type_divergence]
  classifiers:
    logreg: {type: logreg}
    svm: {type: linear_svm}
  window_sentences: 3
  negatives_per_positive: 3
  test_prevalence: [1, 10]
  retrieval: {method: tfidf, k: 10, chunk_sentences: 4}
  alignment: {seeds: both, ngram_size: 4, min_density: 1.0, min_length: 150, verify: true}
  threshold_criterion: f1
  origin_k: 5
