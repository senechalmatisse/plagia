# Étude B — plan recommandé [S] : jeu L+E+S (similarité sémantique LSA) et forêt
# aléatoire : 4 × 3 × 3 × 3 = 108 conditions. Ajoutez « O4 » aux niveaux si le corpus a
# été généré avec un traducteur ou un paraphraseur.
name: study_b_synthetic_extended
task: plagiarism
seed: 42
n_jobs: 4
annotation: {engine: spacy, model: en_core_web_sm, cache_path: data/cache/annotations.sqlite}
protocol: {seeds: 5, bootstrap: 1000}
plagiarism:
  corpus: data/corpora/synthetic
  levels: [O0, O1, O2, O3]
  sizes: [50, 100, 300]
  feature_sets:
    L: [cosine_tfidf, containment_shingles, lcs]
    L+E: [cosine_tfidf, containment_shingles, lcs, jaccard_entities, type_divergence]
    L+E+S: [cosine_tfidf, containment_shingles, lcs, jaccard_entities, type_divergence, semantic]
  classifiers:
    logreg: {type: logreg}
    svm: {type: linear_svm}
    forest: {type: random_forest}
  alignment: {mode: both}
