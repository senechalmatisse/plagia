# Étude C — regroupement (plan de base du § 7.3) :
# 5 variantes de représentation × 2 dimensions × 2 algorithmes × 2 corpus = 40 conditions,
# 5 graines pour k-means (la classification agglomérative est déterministe).
name: study_c_clustering
task: clustering
description: >-
  Étude C : mots (proche du sujet) et style (caractères, mots-outils, étiquettes), avec
  ou sans masquage des entités ; entités et types ; SVD à 100 ou 300 dimensions.
seed: 42
n_jobs: 4
annotation: {engine: spacy, model: en_core_web_sm, cache_path: data/cache/annotations.sqlite}
protocol: {seeds: 5}
clustering:
  corpora:
    c50: {path: data/corpora/c50, split: test, labels: [author]}
    literary: {path: data/corpora/literary, labels: [author, work]}
  representations:
    words: {blocks: [{type: tfidf, params: {min_df: 2}}]}
    words_masked: {blocks: [{type: tfidf, mask: entities, params: {min_df: 2}}]}
    style:
      blocks:
        - {type: char_ngrams, params: {ngram_range: [2, 4], min_df: 2}}
        - {type: stylometry, params: {lengths: false, richness: false}}
        - {type: pos_ngrams}
    style_masked:
      blocks:
        - {type: char_ngrams, mask: entities, params: {ngram_range: [2, 4], min_df: 2}}
        - {type: stylometry, params: {lengths: false, richness: false}}
        - {type: pos_ngrams}
    entities: {blocks: [{type: entities}, {type: types}]}
  dimensions: [100, 300]
  algorithms:
    kmeans: {type: kmeans}
    agglomerative: {type: agglomerative}
  k: "true"
