# Vérification d'auteur [S] sur le corpus littéraire : classificateur de paires et
# méthode des imposteurs [C] ; mesures AUC, F1 et c@1.
name: verification_literary
task: verification
seed: 42
n_jobs: 2
annotation: {engine: spacy, model: en_core_web_sm, cache_path: data/cache/annotations.sqlite}
protocol: {seeds: 5, bootstrap: 1000}
verification:
  corpus: data/corpora/literary
  representations:
    Style:
      blocks:
        - {type: char_ngrams, params: {ngram_range: [3, 5], min_df: 2}}
        - {type: stylometry, weight: 0.5}
  classifiers:
    logreg: {type: logreg}
  imposters: true
  pairs_per_split: 400
  abstain_margin: 0.05
