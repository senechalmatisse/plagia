<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="titre description">
  <title id="titre">plagia</title>
  <desc id="description">Attribution d'auteur, détection de plagiat et regroupement de textes : deux documents dont des passages surlignés sont reliés.</desc>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="17" letter-spacing="2" fill="#898781">TRAITEMENT AUTOMATIQUE DES LANGUES</text>
    <text x="60" y="172" font-size="92" font-weight="700" fill="#0b0b0b" letter-spacing="-2">plagia</text>
    <text x="64" y="218" font-size="26" fill="#52514e">Qui a écrit ce texte ? A-t-il été copié ?</text>

    <g font-size="17" fill="#0b0b0b">
      <circle cx="72" cy="265" r="7" fill="#2a78d6"/>
      <text x="88" y="271">Attribution d'auteur</text>
      <circle cx="292" cy="265" r="7" fill="#eb6834"/>
      <text x="308" y="271">Détection de plagiat</text>
      <circle cx="508" cy="265" r="7" fill="#1baf7a"/>
      <text x="524" y="271">Regroupement</text>
    </g>
  </g>

  <!-- Document suspect -->
  <g transform="translate(700 52)">
    <rect width="190" height="226" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <g fill="#e1e0d9">
      <rect x="20" y="26" width="150" height="9" rx="4.5"/>
      <rect x="20" y="46" width="132" height="9" rx="4.5"/>
      <rect x="20" y="166" width="140" height="9" rx="4.5"/>
      <rect x="20" y="186" width="110" height="9" rx="4.5"/>
    </g>
    <g fill="#eb6834" fill-opacity="0.85">
      <rect x="20" y="66" width="150" height="9" rx="4.5"/>
      <rect x="20" y="86" width="122" height="9" rx="4.5"/>
    </g>
    <g fill="#2a78d6" fill-opacity="0.85">
      <rect x="20" y="116" width="150" height="9" rx="4.5"/>
      <rect x="20" y="136" width="96" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- Sources -->
  <g transform="translate(990 40)">
    <rect width="150" height="112" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <g fill="#e1e0d9">
      <rect x="18" y="20" width="114" height="8" rx="4"/>
      <rect x="18" y="80" width="96" height="8" rx="4"/>
    </g>
    <g fill="#eb6834" fill-opacity="0.85">
      <rect x="18" y="40" width="114" height="8" rx="4"/>
      <rect x="18" y="58" width="88" height="8" rx="4"/>
    </g>
  </g>
  <g transform="translate(990 172)">
    <rect width="150" height="112" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <g fill="#e1e0d9">
      <rect x="18" y="20" width="104" height="8" rx="4"/>
      <rect x="18" y="80" width="114" height="8" rx="4"/>
    </g>
    <g fill="#2a78d6" fill-opacity="0.85">
      <rect x="18" y="40" width="114" height="8" rx="4"/>
